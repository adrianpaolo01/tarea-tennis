<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sumador</title>
  </head>
  <body>
    <main>
      <header>
        <p>Marcador de partido</p>
        <h1>Tenis</h1>
        <p>Registra cada punto y deja que el marcador haga el resto.</p>
      </header>

      <section aria-labelledby="score-title">
        <div>
          <span id="score-title">Partido en curso</span>
          <button type="button" id="reiniciar-button">Reiniciar</button>
        </div>
        <div id="tennis-score" aria-live="polite">Love - Love</div>
        <div>
          <button type="button" id="jugador1-button">
            <span>Jugador 1</span>
            <strong>Anota punto</strong>
          </button>
          <button type="button" id="jugador2-button">
            <span>Jugador 2</span>
            <strong>Anota punto</strong>
          </button>
        </div>
      </section>

      <section aria-labelledby="sumador-title">
        <div>
          <h2 id="sumador-title">Sumador</h2>
        </div>
        <form id="sumar-form">
          <label for="primer-numero">Primer número</label>
          <input type="number" id="primer-numero" required />
          <label for="segundo-numero">Segundo número</label>
          <input type="number" id="segundo-numero" required />
          <button type="submit" id="sumar-button">Sumar</button>
        </form>
        <div id="resultado-div" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
